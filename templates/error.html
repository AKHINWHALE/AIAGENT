<!DOCTYPE html>
<html>
<head>
    <title>Error - AI Assistant Pro</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .error-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        h1 { color: #e53e3e; margin-bottom: 20px; }
        p { color: #4a5568; margin-bottom: 30px; }
        a { color: #667eea; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>Oops! Something went wrong</h1>
        <p>{{ error }}</p>
        <a href="/">← Go back to home</a>
    </div>
</body>
</html>
